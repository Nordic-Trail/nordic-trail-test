name: NORDIC TRAIL - One-off OSM Candidate Snapshot

on:
  pull_request:
    paths:
      - 'scripts/osm_capture_candidate.cjs'
      - 'scripts/osm_capture_candidate_check.cjs'
      - '.github/workflows/osm-candidate-capture.yml'

permissions:
  contents: read

jobs:
  candidate-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout PR snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Mock checks (no internet)
        run: node scripts/osm_capture_candidate_check.cjs
      - name: One bounded read-only request for a review candidate
        run: node scripts/osm_capture_candidate.cjs out/osm-tumba-lida-candidate.json
      - name: Revalidate candidate, never publish automatically
        run: |
          node -e "const fs=require('fs'), {validate}=require('./scripts/osm_static_pack.cjs'); const p=JSON.parse(fs.readFileSync('out/osm-tumba-lida-candidate.json')); if(!validate(p))process.exit(1); console.log('Candidate validated, requires human OSM source review')"
      - name: Store candidate as private workflow artifact for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: osm-tumba-lida-candidate-for-review
          path: out/osm-tumba-lida-candidate.json
          retention-days: 5
          if-no-files-found: error
