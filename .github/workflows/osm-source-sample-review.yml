name: NORDIC TRAIL - OSM Source Sample Review
on:
  pull_request:
    paths:
      - 'scripts/osm_source_sample_audit.cjs'
      - 'scripts/osm_source_sample_audit_check.cjs'
      - '.github/workflows/osm-source-sample-review.yml'
permissions:
  contents: read
jobs:
  source-sample-review:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Offline checks (mock)
        run: node scripts/osm_source_sample_audit_check.cjs
      - name: Compare nine public OSM records with current API
        run: node scripts/osm_source_sample_audit.cjs
