name: NORDIC TRAIL - Security Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Fetch all remote branches and tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'

      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check --status
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
          chmod 755 /tmp/gitleaks-bin/gitleaks

      - name: Scan Git history without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          set +e
          /tmp/gitleaks-bin/gitleaks git \
            --log-opts='--all' \
            --redact \
            --no-banner \
            --report-format json \
            --report-path /tmp/nordic-trail-gitleaks.json \
            . >/dev/null 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo 'PASS: No secrets detected by Gitleaks.'
          elif [ "$result" -eq 1 ]; then
            python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import PurePosixPath

          with open('/tmp/nordic-trail-gitleaks.json', encoding='utf-8') as report:
              findings = json.load(report)
          print(f'FAIL: {len(findings)} potential findings; secret values withheld.')
          groups = Counter(
              (str(item.get('RuleID', 'unknown'))[:80],
               str(PurePosixPath(item.get('File') or 'unknown'))[:160],
               str(item.get('Commit') or 'unknown')[:8])
              for item in findings
          )
          for (rule, filename, commit), count in sorted(groups.items())[:50]:
              safe = lambda s: ''.join(ch if ch.isalnum() or ch in '._/-' else '_' for ch in s)
              print(f'Rule={safe(rule)} File={safe(filename)} Commit={safe(commit)} Count={count}')
          if len(groups) > 50:
              print(f'Additional groups omitted: {len(groups)-50}')
          PY
            exit 1
          else
            echo 'ERROR: Scanner did not complete successfully.'
            exit "$result"
          fi
