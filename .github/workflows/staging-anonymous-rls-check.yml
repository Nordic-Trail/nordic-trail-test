name: NORDIC TRAIL - STAGING Anonymous API RLS Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'staging-app/**'
      - 'staging-reports/**'
      - 'staging-auth-audit/**'
      - 'staging-write-audit/**'
      - 'audits/**'
      - 'scripts/staging_anon_rls_check.py'
      - 'tests/test_staging_anon_rls_check.py'
      - '.github/workflows/staging-anonymous-rls-check.yml'
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read

jobs:
  anon-rls-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test local interpretation of responses (offline)
        run: python3 -m unittest discover -s tests -p 'test_staging_anon_rls_check.py' -v
      - name: Check STAGING anonymous REST metadata (no row bodies)
        env:
          STAGING_PUBLISHABLE_KEY: ${{ secrets.STAGING_PUBLISHABLE_KEY }}
        run: python3 -m scripts.staging_anon_rls_check
