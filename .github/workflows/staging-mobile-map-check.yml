name: NORDIC TRAIL - STAGING Mobile Map Checks

on:
  pull_request:
    paths:
      - 'staging-app/**'
      - 'scripts/staging_mobile_map_check.cjs'
      - '.github/workflows/staging-mobile-map-check.yml'
  push:
    branches: [main]
    paths:
      - 'staging-app/**'
      - 'scripts/staging_mobile_map_check.cjs'
      - '.github/workflows/staging-mobile-map-check.yml'

permissions:
  contents: read

jobs:
  mobile-map-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Offline mobile map tests (no DB keys)
        run: node scripts/staging_mobile_map_check.cjs
