name: NORDIC TRAIL - STAGING OSM Layers
on:
  pull_request:
    paths:
      - 'staging-app/**'
      - 'scripts/staging_osm_layers_check.cjs'
      - '.github/workflows/staging-osm-layers.yml'
  push:
    branches: [main]
    paths:
      - 'staging-app/**'
      - 'scripts/staging_osm_layers_check.cjs'
      - '.github/workflows/staging-osm-layers.yml'
permissions:
  contents: read
jobs:
  staging-osm-layers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate read-only OSM UI and pack offline
        run: node scripts/staging_osm_layers_check.cjs
