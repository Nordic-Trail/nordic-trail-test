name: NORDIC TRAIL - STAGING Surface Prototype
on:
  pull_request:
    paths:
      - 'staging-surfaces/**'
      - 'scripts/build_tumba_lida_surfaces.cjs'
      - 'scripts/staging_surface_layer_check.cjs'
      - '.github/workflows/staging-surfaces.yml'
  push:
    branches: [main]
    paths:
      - 'staging-surfaces/**'
      - 'scripts/build_tumba_lida_surfaces.cjs'
      - 'scripts/staging_surface_layer_check.cjs'
      - '.github/workflows/staging-surfaces.yml'
permissions:
  contents: read
jobs:
  surface-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node scripts/staging_surface_layer_check.cjs
