name: NORDIC TRAIL - STAGING Trips Checks
on:
  pull_request:
    paths:
      - 'staging-trips/**'
      - 'scripts/staging_trips_check.cjs'
      - '.github/workflows/staging-trips-check.yml'
  push:
    branches: [main]
    paths:
      - 'staging-trips/**'
      - 'scripts/staging_trips_check.cjs'
      - '.github/workflows/staging-trips-check.yml'
permissions:
  contents: read
jobs:
  trips:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node scripts/staging_trips_check.cjs
