L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=String(text);return x}
function pair(root,key,val){const row=el('div','item');row.append(el('span','',key),el('strong','',val));root.append(row)}
function makeCard(p){
 const card=el('div','card'); card.append(el('h3','','Informacje o drodze'));
 pair(card,'Nawierzchnia','Żwirowa (grus)');
 const hasWidth=typeof p.szerokosc==='number';
 pair(card,'Szerokość',hasWidth?p.szerokosc.toLocaleString('pl-PL',{maximumFractionDigits:1})+' m (wstępne)':'Brak potwierdzonych danych');
 const r=p.powiazany_wpis_nvdb;
 if(r){
   card.append(el('div','warn','⚠ Możliwe ograniczenie tranzytu'));
   pair(card,'Dostępność','Niezweryfikowana');
   const detail=el('details','details');detail.append(el('summary','','Szczegóły wpisu NVDB'));
   const typ=r.pojazdy==='motordrivna fordon'?'Pojazdy silnikowe':r.pojazdy==='fordon'?'Pojazdy':r.pojazdy;
   pair(detail,'Dotyczy',typ);
   pair(detail,'Rodzaj','Tranzyt (NVDB: sant)');
   pair(detail,'Kierunek','Oba kierunki');
   pair(detail,'Wyjątki','Nieustalone');
   pair(detail,'Zgodność danych','ELEMENT_ID + zakres');
   const note=el('p','note','Odcinek i wpis ograniczenia mają ten sam identyfikator i zakres w NVDB. Nie potwierdza to aktualności przepisu ani prawa przejazdu.');
   detail.append(note);
   const idline=el('p','note','Wpis NVDB: '+r.rekord+' · element: '+r.element_id);
   detail.append(idline);
   card.append(detail);
 }else{
   pair(card,'Ograniczenia','Brak powiązanego wpisu w tym teście');
   pair(card,'Dostępność','Niezweryfikowana');
 }
 if(hasWidth)card.append(el('p','note','Szerokość dopasowana wstępnie; wartość wymaga niezależnej kontroli.'));
 card.append(el('p','note','Dane NVDB nie stanowią potwierdzenia prawa przejazdu. Brak ostrzeżenia nie oznacza legalnej dostępności. Źródło: Trafikverket/NVDB, 13.11.2026.'));
 return card;
}
function heightForPopup(){
 // Ogranicza wysokosc karty do wolnej przestrzeni mapy, takze na telefonie.
 return Math.max(175, Math.min(470, map.getSize().y-112));
}
function showRoadCard(place, props){
 const popup=L.popup({
   maxWidth:330, maxHeight:heightForPopup(),
   autoPan:true, keepInView:true,
   autoPanPaddingTopLeft:[24,24],autoPanPaddingBottomRight:[24,24]
 });
 const content=makeCard(props);
 content.querySelectorAll('details').forEach(details=>{
   details.addEventListener('toggle',()=>{
     // Leaflet koryguje polozenie podczas otwarcia, ale wymaga
     // odswiezenia po ROZWINIECIU szczegolow w karcie.
     requestAnimationFrame(()=>{
       if(!map.hasLayer(popup)) return;
       popup.options.maxHeight=heightForPopup();
       popup.update();
     });
   });
 });
 popup.setLatLng(place).setContent(content).openOn(map);
 return popup;
}
// Kiedy otwieramy karte na telefonie, chowamy panel nakladajacy sie na popup.
map.on('popupopen',()=>document.body.classList.add('nt-road-popup-open'));
map.on('popupclose',()=>document.body.classList.remove('nt-road-popup-open'));
const layer=L.geoJSON(data,{style:{color:'#96764e',weight:3,opacity:.78},onEachFeature:(f,l)=>{
 l.on('click',e=>showRoadCard(e.latlng,f.properties||{}));
 l.on('mouseover',()=>l.setStyle({weight:5,opacity:1}));l.on('mouseout',()=>l.setStyle({weight:3,opacity:.78}));
}}).addTo(map);
document.getElementById('grus').addEventListener('change',e=>e.target.checked?map.addLayer(layer):map.removeLayer(layer));
// Tylko w kopii testowej: otwarcie karty potwierdzonego polaczenia NVDB.
const testFeature=data.features.find(f => f.properties.id === '59093');
if (testFeature) {
  const coords=testFeature.geometry.coordinates;
  const nearest=coords[Math.floor(coords.length/2)];
  const place=L.latLng(nearest[1],nearest[0]);
  map.setView(place,16);
  showRoadCard(place,testFeature.properties);
}
