<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>NT — test czystej mapy OSM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{margin:0;width:100%;height:100%;height:100dvh;padding:0}
body{background:#d8e6e9;font-family:system-ui,-apple-system,sans-serif}
#map{background:#d8e6e9}
#status{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;z-index:1000;padding:8px 12px;border-radius:10px;background:rgba(16,35,27,.90);color:white;font-size:12px;line-height:1.6;max-width:calc(100% - 110px);pointer-events:none}
#home{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:1000;background:#233e30;color:white;border:1px solid #d9ead8;border-radius:10px;padding:10px;font-size:14px;min-height:44px;cursor:pointer}
.leaflet-control-zoom{margin-bottom:32px!important}
</style>
</head>
<body>
<div id="map" aria-label="Mapa OSM do izolowanego testu płynności"></div>
<div id="status" role="status" aria-live="off">TEST CZYSTEJ MAPY OSM<br>Uruchamianie…</div>
<button id="home" type="button">Gnesta</button>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
(function(){
  const label=document.getElementById('status');
  if(!window.L){label.textContent='Brak biblioteki Leaflet';return;}
  const map=L.map('map',{fadeAnimation:false,zoomAnimation:false,zoomControl:true})
    .setView([59.10,17.28],14);
  const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,attribution:'© OpenStreetMap contributors',
    updateWhenIdle:false,updateInterval:200,keepBuffer:2
  });
  let ok=0,errors=0,inProgress=0,moving=false;
  function paint(){
    label.textContent='TEST CZYSTEJ MAPY OSM\n'
      +'Bez NVDB, paneli i Supabase\n'
      +'Fade OFF | '+(moving?'W ruchu':'Zatrzymana')+'\n'
      +'Kafelki: '+ok+' | Czeka: '+inProgress+' | Błędy: '+errors;
  }
  tiles.on('tileloadstart',()=>{inProgress++;paint()});
  tiles.on('tileload',()=>{ok++;inProgress=Math.max(0,inProgress-1);paint()});
  tiles.on('tileerror',()=>{errors++;inProgress=Math.max(0,inProgress-1);paint()});
  tiles.on('tileabort',()=>{inProgress=Math.max(0,inProgress-1);paint()});
  map.on('movestart',()=>{moving=true;paint()});
  map.on('moveend',()=>{moving=false;paint()});
  tiles.addTo(map);
  document.getElementById('home').addEventListener('click',()=>map.setView([59.10,17.28],14,{animate:false}));
  paint();
})();
</script>
</body>
</html>
