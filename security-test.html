<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NORDIC TRAIL — test uprawnień RPC</title>
<style>
body{font-family:system-ui,sans-serif;max-width:650px;margin:35px auto;padding:0 18px;line-height:1.5;background:#101b18;color:#f1f4ee}button{background:#c1d39c;border:0;border-radius:9px;padding:14px 18px;font-weight:700;font-size:16px}button:disabled{opacity:.5}section{background:#22332d;border-radius:12px;padding:16px;margin:16px 0}.pass{color:#b8eea5}.fail{color:#ffb4a7}.muted{color:#c9d1c9}code{overflow-wrap:anywhere}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<h1>NORDIC TRAIL</h1><h2>Test odmowy dostępu do RPC</h2>
<p>Strona tylko do diagnostyki. Nie wyświetla ani nie zapisuje tokenów, adresów e-mail czy odpowiedzi zawierających dane.</p>
<section><strong>Sesja:</strong> <span id="session">Sprawdzanie…</span></section>
<button id="run" disabled>Uruchom testy</button>
<section aria-live="polite"><div id="result">Najpierw sprawdzamy sesję.</div></section>
<p class="muted">Wynik pozytywny oznacza odmowę dostępu dla aktualnej sesji, a nie pełny audyt uprawnień.</p>
<script>
'use strict';
// Publiczne dane konfiguracyjne aplikacji; nigdy nie wstawiaj service_role ani secret.
const SUPABASE_URL = 'https://kwhkxedmtehqplvnmjka.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9NwkykVx5UuNhnyPlD5vFw_t7zfqSvE';
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const statusEl = document.getElementById('session');
const resultEl = document.getElementById('result');
const button = document.getElementById('run');
async function checkSession(){
  const {data,error} = await client.auth.getUser();
  if(error || !data?.user){statusEl.textContent='Brak potwierdzonej sesji. Nie uruchamiaj testu.';return;}
  statusEl.textContent='Zalogowany użytkownik (tożsamość ukryta).';
  button.disabled=false;
  resultEl.textContent='Gotowe do uruchomienia.';
}
button.addEventListener('click',async()=>{
  button.disabled=true;
  resultEl.replaceChildren();
  for(const fn of ['admin_pending_map_points','admin_pending_point_reports']){
    const p=document.createElement('p');
    const {data,error}=await client.rpc(fn);
    const denied=error && (error.code==='P0001' && error.message?.includes('Brak uprawnień administratora'));
    p.className=denied?'pass':'fail';
    p.textContent=fn+': '+(denied?'PASS — odmowa dostępu':error?'DO ANALIZY — inny błąd ('+(error.code||'brak kodu')+')':'ALARM — wywołanie nie zostało odrzucone');
    resultEl.appendChild(p);
    // Nigdy nie pokazuj odpowiedzi RPC, nawet gdy dostęp został błędnie przyznany.
    void data;
  }
  button.disabled=false;
});
checkSession().catch(()=>{statusEl.textContent='Błąd weryfikacji sesji.';});
</script>
</body>
</html>
