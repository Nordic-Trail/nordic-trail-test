<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NORDIC TRAIL — audyt dostępności</title><style>body{font:16px system-ui;background:#1b2d23;color:#f1f4e9;max-width:760px;margin:auto;padding:18px}h1{font-size:24px}article{background:#293f33;border:1px solid #78977a;border-radius:12px;padding:12px;margin:10px 0}button{background:#c6dca4;color:#172b1e;border:0;border-radius:10px;min-height:48px;padding:10px 16px;font-weight:700;width:100%}.exclude{color:#ffb9b0}.review{color:#ffe0a0}.candidate{color:#b9e6c3}small{display:block;color:#d1e1d0}#summary{margin:15px 0;font-weight:bold}</style></head><body><h1>Audyt tras samochodowych</h1><p>Osobny prototyp. Dane syntetyczne — nie rzeczywiste drogi. Wynik nie potwierdza prawa przejazdu.</p><button id="run">Uruchom 20 testów</button><p id="summary" role="status"></p><main id="results"></main><script src="./road-access-core.js"></script><script>const fixtures=[{"name":"Asfalt — droga publiczna","e":{"match":"exact","osm":{"highway":"residential","surface":"asphalt"}},"expected":"candidate"},{"name":"Szuter — sieć samochodowa NVDB","e":{"match":"exact","osm":{"highway":"track","surface":"gravel"},"nvdbNetwork":"motor"},"expected":"candidate"},{"name":"Szutrowa ścieżka piesza bez szerokości","e":{"match":"exact","osm":{"highway":"footway","surface":"gravel"}},"expected":"exclude"},{"name":"Chodnik asfaltowy","e":{"match":"exact","osm":{"highway":"footway","footway":"sidewalk","surface":"asphalt"}},"expected":"exclude"},{"name":"Ścieżka rowerowa","e":{"match":"exact","osm":{"highway":"cycleway","surface":"gravel"}},"expected":"exclude"},{"name":"Szuter, brak klasy drogi","e":{"match":"exact","osm":{"surface":"gravel"}},"expected":"review"},{"name":"Droga leśna, brak danych dostępu","e":{"match":"exact","osm":{"highway":"track","surface":"gravel"}},"expected":"review"},{"name":"Szuter, zakaz samochodów","e":{"match":"exact","osm":{"highway":"track","surface":"gravel","motorcar":"no"}},"expected":"exclude"},{"name":"Sprzeczność OSM–NVDB","e":{"match":"exact","osm":{"highway":"residential"},"nvdbNetwork":"walk"},"expected":"review"},{"name":"Ograniczenie warunkowe","e":{"match":"exact","osm":{"highway":"residential","motor_vehicle:conditional":"no @ (Nov-Mar)"}},"expected":"review"},{"name":"Ogólny dostęp nie zmienia ścieżki w drogę","e":{"match":"exact","osm":{"highway":"path","access":"yes"}},"expected":"exclude"},{"name":"Ścieżka ze szczególną zgodą dla samochodów","e":{"match":"exact","osm":{"highway":"path","motorcar":"yes"}},"expected":"review"},{"name":"Niepewne dopasowanie geometryczne","e":{"match":"ambiguous","osm":{"highway":"residential"}},"expected":"review"},{"name":"Szlaban","e":{"match":"exact","osm":{"highway":"track","motor_vehicle":"yes"},"barrier":true},"expected":"review"},{"name":"Droga z potwierdzonym ograniczeniem w kontekście","e":{"match":"exact","osm":{"highway":"residential"},"restriction":"confirmed_for_context"},"expected":"exclude"},{"name":"Ograniczenie tranzytu","e":{"match":"exact","osm":{"highway":"service","motor_vehicle":"destination"}},"expected":"exclude"},{"name":"Dostęp ogólny i szczególny","e":{"match":"exact","osm":{"highway":"residential","access":"yes","motorcar":"no"}},"expected":"exclude"},{"name":"Brak danych źródłowych","e":{"match":"exact","osm":{}},"expected":"review"}];const R=window.NTRoadAudit;const labels={exclude:'Wyklucz z automatycznej trasy',review:'Wymaga weryfikacji',candidate:'Kandydat — bez potwierdzenia przejazdu'};document.getElementById('run').onclick=()=>{const list=document.getElementById('results');list.replaceChildren();let n=0;const rows=fixtures.map(f=>({...f,actual:R.assess(f.e)}));rows.push({name:'Trasa mieszana: asfalt + ścieżka piesza',expected:'exclude',actual:R.assessRoute([fixtures[0].e,fixtures[2].e])},{name:'Trasa bez danych o odcinkach',expected:'review',actual:R.assessRoute([])});for(const f of rows){const ok=f.actual.status===f.expected;n+=Number(ok);const a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('p'),r=document.createElement('small');h.textContent=(ok?'PASS — ':'FAIL — ')+f.name;p.textContent=labels[f.actual.status];p.className=f.actual.status;r.textContent=f.actual.reason||'Ocena całej trasy';a.append(h,p,r);list.append(a);}document.getElementById('summary').textContent=n+' / '+rows.length+' testów zaliczonych';};</script></body></html>
