<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NORDIC TRAIL — geometria OSM–NVDB</title><style>body{font:16px system-ui;background:#1b2d23;color:#f1f4e9;max-width:760px;margin:auto;padding:18px}h1{font-size:24px}article{background:#293f33;border:1px solid #78977a;border-radius:12px;padding:12px;margin:10px 0}button{background:#c6dca4;color:#172b1e;border:0;border-radius:10px;min-height:48px;font:700 16px system-ui;width:100%}small{display:block;color:#d1e1d0}.review{color:#ffe0a0}.candidate{color:#b9e6c3}</style></head><body><h1>Dopasowanie OSM–NVDB</h1><p>Test symulacyjny geometrii w metrach. Progi 6 i 12 m oraz zgodność kierunku 30° są wyłącznie robocze. Nie pobieramy danych ani nie wyznaczamy tras.</p><button id="run">Uruchom 14 testów</button><p id="status" role="status"></p><main id="results"></main><script src="./network-match-core.js?v=1"></script><script>const fixtures=[{"name":"Jedna zgodna geometria","line":[[0,0],[100,0]],"records":[{"elementId":"synthetic:a","featureOid":"synthetic:feature:a","network":"motor","line":[[0,0],[100,0]]}],"expected":"candidate"},{"name":"Równoległa droga rowerowa – 4 m","line":[[0,0],[100,0]],"records":[{"elementId":"synthetic:a","featureOid":"synthetic:feature:a","network":"motor","line":[[0,0],[100,0]]},{"elementId":"synthetic:b","featureOid":"synthetic:feature:b","network":"cycle","line":[[0,4],[100,4]]}],"expected":"review"},{"name":"Równoległa ścieżka piesza – 3 m","line":[[0,0],[100,0]],"records":[{"elementId":"synthetic:a","featureOid":"synthetic:feature:a","network":"motor","line":[[0,0],[100,0]]},{"elementId":"synthetic:c","featureOid":"synthetic:feature:c","network":"walk","line":[[0,3],[100,3]]}],"expected":"review"},{"name":"Odwrócona kolejność współrzędnych","line":[[0,0],[100,0]],"records":[{"elementId":"synthetic:a","featureOid":"synthetic:feature:a","network":"motor","line":[[100,0],[0,0]]}],"expected":"candidate"},{"name":"Droga przecinająca pod kątem prostym","line":[[0,0],[100,0]],"records":[{"elementId":"synthetic:a","featureOid":"synthetic:feature:a","network":"motor","line":[[0,0],[100,0]]},{"elementId":"synthetic:b","featureOid":"synthetic:feature:b","network":"cycle","line":[[50,-30],[50,30]]}],"expected":"candidate"},{"name":"Tylko odcinek przecinający","line":[[0,0],[100,0]],"records":[{"elementId":"synthetic:b","featureOid":"synthetic:feature:b","network":"cycle","line":[[50,-30],[50,30]]}],"expected":"review"},{"name":"Niepełne pokrycie","line":[[0,0],[100,0]],"records":[{"elementId":"synthetic:a","featureOid":"synthetic:feature:a","network":"motor","line":[[0,0],[45,0]]}],"expected":"review"},{"name":"Podzielony odcinek NVDB","line":[[0,0],[100,0]],"records":[{"elementId":"synthetic:a","featureOid":"synthetic:feature:a","network":"motor","line":[[0,0],[50,0]]},{"elementId":"synthetic:b","featureOid":"synthetic:feature:b","network":"motor","line":[[50,0],[100,0]]}],"expected":"review"},{"name":"Odcinek oddalony","line":[[0,0],[100,0]],"records":[{"elementId":"synthetic:a","featureOid":"synthetic:feature:a","network":"motor","line":[[0,25],[100,25]]}],"expected":"review"},{"name":"Brak danych NVDB","line":[[0,0],[100,0]],"records":[],"expected":"review"},{"name":"Brak identyfikatora","line":[[0,0],[100,0]],"records":[{"elementId":"","featureOid":"synthetic:feature:a","network":"motor","line":[[0,0],[100,0]]}],"expected":"review"},{"name":"Brak rodzaju sieci","line":[[0,0],[100,0]],"records":[{"elementId":"synthetic:a","featureOid":"synthetic:feature:a","network":"unknown","line":[[0,0],[100,0]]}],"expected":"review"},{"name":"Tylko sieć rowerowa – nie potwierdzamy samochodowej","line":[[0,0],[100,0]],"records":[{"elementId":"synthetic:b","featureOid":"synthetic:feature:b","network":"cycle","line":[[0,4],[100,4]]}],"expected":"candidate"},{"name":"Krótki odcinek – niewystarczające dane","line":[[0,0],[8,0]],"records":[{"elementId":"synthetic:a","featureOid":"synthetic:feature:a","network":"motor","line":[[0,0],[100,0]]}],"expected":"review"}];document.getElementById('run').onclick=()=>{const list=document.getElementById('results');list.replaceChildren();let passed=0;for(const f of fixtures){const r=window.NTNetworkMatch.compare(f.line,f.records),ok=r.status===f.expected&&r.match==='unconfirmed'&&r.legalAccess==='unverified';passed+=Number(ok);const a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('p'),q=document.createElement('small');h.textContent=(ok?'PASS — ':'FAIL — ')+f.name;p.textContent=r.reason;p.className=r.status;q.textContent=r.candidates.map(c=>c.network+' · pokrycie '+Math.round(c.coverage*100)+'%').join(' / ')||'Brak kandydata';a.append(h,p,q);list.append(a);}document.getElementById('status').textContent=passed+' / '+fixtures.length+' testów zaliczonych';};</script></body></html>
