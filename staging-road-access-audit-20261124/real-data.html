<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NORDIC TRAIL — rzeczywiste dane dróg</title><style>body{font:16px system-ui;background:#1b2d23;color:#f1f4e9;max-width:760px;margin:auto;padding:18px}h1{font-size:24px}article{background:#293f33;border:1px solid #78977a;border-radius:12px;padding:12px;margin:10px 0}button{background:#c6dca4;color:#172b1e;border:0;border-radius:10px;min-height:48px;padding:10px 16px;font-weight:700;width:100%}button:disabled{opacity:.6}a{color:#c6dca4}small{display:block;color:#d1e1d0}.exclude{color:#ffb9b0}.review{color:#ffe0a0}.candidate{color:#b9e6c3}#status{white-space:pre-line}</style></head><body><h1>Audyt rzeczywistych danych</h1><p>Gnesta / Klämmingen — publiczne dane mapowe. Bez lokalizacji telefonu, bez trasowania i bez zmian w planerze.</p><label for="area">Obszar testowy</label><select id="area" style="display:block;width:100%;min-height:44px;margin:8px 0 14px;font:inherit"><option value="0">Gnesta — centrum</option><option value="1">Klämmingen — południe</option><option value="2">Szukaj: szutrowa ścieżka piesza</option><option value="3">Szukaj: chodnik</option><option value="4">Szukaj: ograniczenie tranzytu</option></select><button id="run">Pobierz i porównaj dane</button><button id="backup" hidden style="margin-top:10px">Spróbuj z drugim serwerem</button><p id="status" role="status"></p><main id="results"></main><script src="./road-access-core.js?v=local-access2"></script><script>
'use strict';
const $=id=>document.getElementById(id);
const boxes=[[59.043,17.310,59.047,17.318],[59.113,17.274,59.125,17.288]];
const endpoints=['https://overpass-api.de/api/interpreter','https://ovp.dresel.systems/api/interpreter'];
const regionalBox='59.02,17.24,59.17,17.39';
const makeQuery=i=>{
 if(i<2)return '[out:json][timeout:40];way["highway"]('+boxes[i].join(',')+');out tags geom;';
 const filters=[
  ['["highway"~"^(footway|path|pedestrian)$"]["surface"~"^(gravel|fine_gravel)$"]'],
  ['["highway"="footway"]["footway"="sidewalk"]'],
  ['motorcar','motor_vehicle','vehicle','access'].map(k=>'["highway"]["'+k+'"="destination"]')
 ][i-2];
 if(!filters)throw Error('Nieznany zakres testu');
 return '[out:json][timeout:40];('+filters.map(f=>'way'+f+'('+regionalBox+');').join('')+');out tags geom;';
};
const pathClasses=new Set(['footway','path','pedestrian','steps','cycleway','bridleway']);
const xy=(lon,lat)=>[lon*111320*Math.cos(59.1*Math.PI/180),lat*111320];
function dist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy||1)));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);}
function distance(p,line){let best=Infinity;for(let i=1;i<line.length;i++)best=Math.min(best,dist(p,line[i-1],line[i]));return best;}
function samples(line){const out=[];for(let i=1;i<line.length;i++){const a=line[i-1],b=line[i],n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/15));for(let k=0;k<n;k++){const t=(k+.5)/n;out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);if(out.length>1500)return [];}}return out;}
function compare(line,roads){const pts=samples(line);if(!pts.length)return null;const ranked=[];for(const r of roads){const bounds=r.bounds;if(!pts.some(p=>p[0]>=bounds[0]-30&&p[0]<=bounds[2]+30&&p[1]>=bounds[1]-30&&p[1]<=bounds[3]+30))continue;const ds=pts.map(p=>distance(p,r.line));const close=ds.filter(d=>d<=10).length;const share=close/ds.length;if(share>0)ranked.push({id:r.id,share,mean:ds.reduce((a,b)=>a+b,0)/ds.length});}ranked.sort((a,b)=>b.share-a.share||a.mean-b.mean);return ranked.slice(0,3);}
async function get(url,timeout=60000){const c=new AbortController(),timer=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(url,{credentials:'omit',signal:c.signal,referrerPolicy:'no-referrer'});if(!r.ok)throw Error('HTTP '+r.status);return await r.json();}catch(e){if(c.signal.aborted)throw Error('timeout');throw e;}finally{clearTimeout(timer);}}
function add(title,lines,id,status){const a=document.createElement('article'),h=document.createElement('strong');h.textContent=title;a.append(h);for(const [line,cls] of lines){const p=document.createElement('p');p.textContent=line;if(cls)p.className=cls;a.append(p);}const link=document.createElement('a');link.href='https://www.openstreetmap.org/way/'+id;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Zobacz źródło OSM — '+id;a.append(link);$('results').append(a);}
async function run(server=0){const button=$('run'),backup=$('backup'),area=$('area');button.disabled=backup.disabled=area.disabled=true;backup.hidden=true;$('results').replaceChildren();let stage='NVDB';$('status').textContent='Wczytywanie danych NVDB…';try{
 const nv=await get('../staging-nvdb/data/gnesta-nvdb-v4.json');
 const roads=nv.features.filter(f=>f.geometry?.type==='LineString').map(f=>{const line=f.geometry.coordinates.map(p=>xy(p[0],p[1]));const xs=line.map(p=>p[0]),ys=line.map(p=>p[1]);return {id:f.properties.id,line,bounds:[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]};});
 stage='OSM';$('status').textContent='NVDB: wczytano '+roads.length+' odcinków.\nPobieranie danych OSM dla wybranego zakresu…';
 const osm=await get(endpoints[server]+'?data='+encodeURIComponent(makeQuery(Number(area.value))));
 if(!Array.isArray(osm.elements)||osm.remark)throw Error('Niekompletna odpowiedź OSM');
 const ways=osm.elements.filter(w=>w.type==='way'&&w.tags?.highway&&Array.isArray(w.geometry)&&w.geometry.length>=2);
 const allCases=[['Ścieżka szutrowa',t=>['footway','path','pedestrian'].includes(t.highway)&&['gravel','fine_gravel'].includes(t.surface)],['Chodnik',t=>t.highway==='footway'&&t.footway==='sidewalk'],['Ścieżka piesza',t=>['footway','path'].includes(t.highway)],['Droga rowerowa',t=>t.highway==='cycleway'],['Droga gruntowa',t=>t.highway==='track'],['Droga samochodowa',t=>['residential','unclassified','tertiary','secondary','primary'].includes(t.highway)],['Ograniczenie tranzytu',t=>['motorcar','motor_vehicle','vehicle','access'].some(k=>t[k]==='destination')]];
 const labels={exclude:'Wyklucz z trasy samochodowej',review:'Wymaga weryfikacji',candidate:'Kandydat — bez potwierdzenia przejazdu'};
 const selection=Number(area.value);const cases=selection<2?allCases:[allCases[({2:0,3:1,4:6})[selection]]];
 let count=0;const missing=[],seen=new Set();for(const [name,filter] of cases){const matches=ways.filter(w=>filter(w.tags)&&!seen.has(w.id));if(!matches.length){missing.push(name);continue;}const w=matches[0];seen.add(w.id);const result=window.NTRoadAudit.assess({match:'exact',osm:w.tags});const candidates=compare(w.geometry.map(p=>xy(p.lon,p.lat)),roads);
 const tags=['highway','surface','width','footway','motorcar','motor_vehicle','vehicle','access'].filter(k=>w.tags[k]!=null).map(k=>k+'='+w.tags[k]).join(' · ');
 const comparison=candidates?.length?candidates.map(c=>'NVDB '+c.id+': '+Math.round(c.share*100)+'% próbek w promieniu 10 m; średnio '+c.mean.toFixed(1)+' m').join(' / '):'Brak pobliskiego odcinka w lokalnym zbiorze szutrowym lub za długa geometria.';
 add(name,[[tags,''],[labels[result.status],result.status],[result.reason,''],[comparison,''],['Bliskość geometrii nie potwierdza tożsamości dróg. Nie przekazujemy jej jako potwierdzenia dostępności.','review']],w.id);count++;}
 $('status').textContent='OSM: '+ways.length+' odcinków; NVDB: '+roads.length+' odcinków szutrowych.\nPrzykłady: '+count+' / '+cases.length+' kategorii.\nOSM: '+(osm.osm3s?.timestamp_osm_base||'brak daty')+'\nNVDB: '+(nv.metadata?.source_date||'brak daty')+(missing.length?'\nNie znaleziono w obszarze: '+missing.join(', '):'');
 }catch(e){console.warn('Audit source',stage,e);$('results').replaceChildren();$('status').textContent=stage+': '+(e.message==='timeout'?'Serwer nie odpowiedział w wyznaczonym czasie.':'Nie udało się wczytać kompletnych danych.')+' Nie wydajemy oceny na podstawie brakujących danych.';backup.hidden=stage!=='OSM'||server!==0;}finally{button.disabled=backup.disabled=area.disabled=false;}}
$('run').onclick=()=>run(0);$('backup').onclick=()=>run(1);$('area').onchange=()=>{$('backup').hidden=true;$('results').replaceChildren();$('status').textContent='';};
</script></body></html>
